<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="satotek.dev">
  <style>
    :root {
      --bg: #f6f2ff;
      --fg: #2c2939;
      --border: rgba(44, 41, 57, .12);
      --accent: #7d60bc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17161f;
        --fg: #e9e6f0;
        --border: rgba(233, 230, 240, .16);
        --accent: #c2a7f4;
      }
    }
    text {
      font-family: "Geist", "Zen Kaku Gothic New", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
    }
  </style>
  <rect width="512" height="512" rx="104" fill="var(--bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="var(--border)" stroke-width="8"/>
  <text x="256" y="315" text-anchor="middle" font-size="300" fill="var(--fg)">s</text>
  <circle cx="330" cy="316" r="16" fill="var(--accent)"/>
</svg>
