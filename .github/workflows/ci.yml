name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI: true
  VITE_GA_MEASUREMENT_ID: G-SMOKE1234

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build the production preview
        run: bun run build
