name: Generate OGP images

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - content/posts/**/index.md

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed posts
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            content/posts/**/index.md

      - name: Set up Bun
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: bun install --frozen-lockfile

      - name: Generate and upload OGP images
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] || bun run generate-ogp -- --file "$file" --upload
          done <<< "${{ steps.changed-files.outputs.all_changed_files }}"
