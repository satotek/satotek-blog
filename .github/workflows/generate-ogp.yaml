name: Generate OGP images

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - src/content/posts/**/index.mdx

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find changed posts
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            src/content/posts/**/index.mdx

      - name: Set up pnpm
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate and upload OGP images
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] || pnpm run generate-ogp --file "$file" --upload
          done <<< "${{ steps.changed-files.outputs.all_changed_files }}"
